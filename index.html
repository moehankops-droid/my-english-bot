<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI English Quiz - Duolingo Style</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #58cc02; }
        button { background: #58cc02; color: white; border: none; padding: 12px 20px; border-radius: 10px; font-size: 16px; cursor: pointer; margin-top: 15px; width: 100%; }
        button:hover { background: #46a302; }
        .question-box { font-size: 18px; margin: 20px 0; font-weight: bold; color: #333; }
        .options button { background: #fff; color: #4b4b4b; border: 2px solid #e5e5e5; margin: 8px 0; }
        .options button:hover { background: #f7f7f7; border-color: #58cc02; }
    </style>
</head>
<body>

<div class="card">
    <h2>🤖 Gemini AI English Quiz</h2>
    <div id="quiz-container">
        <p>AI ဆီမှ Grade 8 အင်္ဂလိပ်စာ မေးခွန်းအသစ်များ ရယူရန် အောက်ပါခလုတ်ကို နှိပ်ပါ</p>
        <button onclick="loadAIQuestion()">မေးခွန်းအသစ် တောင်းမည်</button>
    </div>
</div>

<script>
async function loadAIQuestion() {
    const container = document.getElementById("quiz-container");
    container.innerHTML = "<p>⏳ Gemini AI က မေးခွန်းထုတ်နေပါပြီ၊ ခဏစောင့်ပါ...</p>";

    const apiKey = "AIzaSyAb8RN6ls6S8Yr97nANGSNtBzrPNXa7jXkXWacvIR2ynlX8Q-5g"; 

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: "Generate a multiple-choice English grammar question for Grade 8. You MUST output ONLY raw JSON without any markdown formatting, using exactly this structure: {\"question\": \"...\", \"options\": [\"A\", \"B\", \"C\", \"D\"], \"answer\": \"Correct Option\"}"
                    }]
                }]
            })
        });

        const data = await response.json();
        
        if (!data.candidates || data.candidates.length === 0) {
            throw new Error("AI response error");
        }

        let rawText = data.candidates[0].content.parts[0].text;
        
        // JSON စာသားကို သန့်စင်ခြင်း (Markdown ပုံစံများကို ဖယ်ရှားရန်)
        rawText = rawText.replace(/```json/gi, "").replace(/```/g, "").trim();
        
        // ပထမနဲ့ နောက်ဆုံး curly braces တွေကိုသာ ဖြတ်ထုတ်ရန်
        const jsonStart = rawText.indexOf('{');
        const jsonEnd = rawText.lastIndexOf('}');
        if (jsonStart !== -1 && jsonEnd !== -1) {
            rawText = rawText.substring(jsonStart, jsonEnd + 1);
        }

        const quizData = JSON.parse(rawText);

        let optionsHTML = "";
        quizData.options.forEach(opt => {
            optionsHTML += `<button onclick="checkAnswer('${opt.replace(/'/g, "\\'")}', '${quizData.answer.replace(/'/g, "\\'")}')">${opt}</button>`;
        });

        container.innerHTML = `
            <div class="question-box">${quizData.question}</div>
            <div class="options">${optionsHTML}</div>
        `;
    } catch (error) {
        console.error(error);
        container.innerHTML = `<p style="color: red;">❌ မေးခွန်းထုတ်ယူရာတွင် အမှားအယွင်းရှိပါသည် (VPN သို့မဟုတ် API Connection စစ်ပါ)</p><button onclick="loadAIQuestion()">ပြန်ကြိုးစားရန်</button>`;
    }
}

function checkAnswer(selected, correct) {
    if (selected.trim() === correct.trim()) {
        alert("🎉 မှန်ကန်ပါတယ် သူငယ်ချင်းရေ!");
    } else {
        alert(`❌ မှားပါတယ်။ အဖြေမှန်ကတော့: ${correct} ပါ။`);
    }
    loadAIQuestion();
}
</script>

</body>
</html>
